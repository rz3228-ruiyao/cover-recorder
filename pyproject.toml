[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-syncer"
version = "0.1.0"
description = "Windows desktop MVP for syncing cover video with high quality audio."
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
where = ["src"]
